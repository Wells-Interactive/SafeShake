name: safeshake
description: SafeShake — Safety in the Shake of Your Hand.
publish_to: "none"
version: 0.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0
  google_sign_in: ^6.2.1
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  sensors_plus: ^6.0.1
  url_launcher: ^6.3.0
  provider: ^6.1.2
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
