name: Build Brainyte SafeShake Android AAB

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safeshake-android-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-aab:
    name: Build and Upload Signed SafeShake AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Check Flutter and Java versions
        run: |
          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: flutter pub get

      # --------------------------------------------------
      # RESTORE FIREBASE ANDROID CONFIGURATION
      # --------------------------------------------------

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          if ! printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode \
            > android/app/google-services.json; then
            echo "ERROR: Firebase Android configuration decoding failed."
            exit 1
          fi

          if [ ! -s android/app/google-services.json ]; then
            echo "ERROR: Firebase Android configuration is empty."
            exit 1
          fi

          python3 -m json.tool android/app/google-services.json > /dev/null

          echo "Firebase Android configuration restored successfully."

      # --------------------------------------------------
      # RESTORE BRAINYTE RELEASE KEYSTORE
      # --------------------------------------------------

      - name: Decode Brainyte Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing or empty."
            exit 1
          fi

          mkdir -p android/app

          echo "Restoring Brainyte release keystore..."

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/brainyte-apps-release.jks; then
            echo "ERROR: Keystore Base64 decoding failed."
            exit 1
          fi

          if [ ! -s android/app/brainyte-apps-release.jks ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          file android/app/brainyte-apps-release.jks

          echo "Brainyte release keystore restored successfully."

      # --------------------------------------------------
      # CREATE ANDROID SIGNING CONFIGURATION
      # --------------------------------------------------

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: One or more Android signing secrets are missing."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/brainyte-apps-release.jks
          EOF

          echo "Android signing configuration created."

      # --------------------------------------------------
      # VERIFY KEYSTORE
      # --------------------------------------------------

      - name: Verify Brainyte release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore android/app/brainyte-apps-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Android signing keystore verified successfully."

      # --------------------------------------------------
      # BUILD RELEASE AAB
      # --------------------------------------------------

      - name: Build Release AAB
        run: flutter build appbundle --release

      # --------------------------------------------------
      # VERIFY AAB
      # --------------------------------------------------

      - name: Verify AAB file
        run: |
          set -euo pipefail

          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"

          echo "Checking generated SafeShake AAB..."

          if [ ! -s "$AAB_PATH" ]; then
            echo "ERROR: SafeShake release AAB was not generated."
            exit 1
          fi

          ls -lh "$AAB_PATH"
          du -h "$AAB_PATH"

          echo "SafeShake AAB successfully generated."

      # --------------------------------------------------
      # UPLOAD SIGNED AAB
      # --------------------------------------------------

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: safeshake-android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      # --------------------------------------------------
      # BUILD SUMMARY
      # --------------------------------------------------

      - name: Publish build summary
        if: success()
        run: |
          echo "## Brainyte SafeShake Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Format:** Android App Bundle (AAB)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package ID:** com.wellsint.brainyte.safeshake" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** $(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Signing:** Brainyte release keystore" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** safeshake-android-release-aab" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Retention:** 1 day" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The signed SafeShake AAB is available in the workflow Artifacts section." >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------
      # CLEANUP
      # --------------------------------------------------

      - name: Clean signing and Firebase files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/brainyte-apps-release.jks
          rm -f android/app/google-services.json

          echo "Temporary signing and Firebase files cleaned."
