name: Build Brainyte SafeShake APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safeshake-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and Upload Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          sdkmanager "platforms;android-37" "platform-tools"

      - name: Check Flutter and Java versions
        run: |
          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/safeshake-release.jks

          if [ ! -s android/app/safeshake-release.jks ]; then
            echo "ERROR: Keystore file is empty or invalid."
            exit 1
          fi

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: One or more Android signing secrets are missing."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/safeshake-release.jks
          EOF

      - name: Verify decoded keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/app/safeshake-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK file
        run: |
          echo "Checking generated SafeShake APK..."

          ls -lah build/app/outputs/flutter-apk/

          if [ ! -s build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated."
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: safeshake-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish build summary
        if: success()
        run: |
          echo "## Brainyte SafeShake Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Format:** Signed Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** $(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package:** com.wellsint.brainyte.safeshake" >> "$GITHUB_STEP_SUMMARY"
          echo "- **File:** app-release.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Retention:** 1 day" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The signed APK is available in the workflow Artifacts section." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/safeshake-release.jks
