name: Build Brainyte SafeShake Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safeshake-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed SafeShake APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools, platforms;android-36'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: One or more Android signing secrets are missing."
            exit 1
          fi

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/safeshake-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/safeshake-release.jks
          EOF

          echo "Release signing files configured."

      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore android/app/safeshake-release.jks \
            -storepass "$KEYSTORE_PASSWORD"

      - name: Build SafeShake release APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Upload SafeShake APK
        uses: actions/upload-artifact@v4
        with:
          name: safeshake-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish build summary
        run: |
          echo "## Brainyte SafeShake Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build status: Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build type: Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package ID: com.wellsint.brainyte.safeshake" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android SDK: 36" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flutter: 3.44.3" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: app-release.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/safeshake-release.jks
